
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - NEXORA COMICS</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #10121b;
      color: white;
      font-family: Arial, sans-serif;
    }
    .panel {
      width: 100%;
      max-width: 390px;
      padding: 28px;
      background: #1c2030;
      border: 1px solid #34394e;
      border-radius: 16px;
    }
    h1 { color: #9b8cff; font-size: 25px; }
    p { color: #b9bfd1; line-height: 1.5; }
    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 9px;
      font-size: 16px;
    }
    input {
      background: #10121b;
      color: white;
      border: 1px solid #454b62;
    }
    button {
      border: 0;
      background: #7965ed;
      color: white;
      font-weight: bold;
    }
    #status { margin-top: 16px; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>NEXORA COMICS</h1>
    <p>Buat password baru untuk akunmu.</p>

    <input
      id="newPassword"
      type="password"
      placeholder="Password baru (minimal 8 karakter)"
      autocomplete="new-password"
    >

    <button id="updateButton" onclick="updatePassword()">
      Simpan Password Baru
    </button>

    <p id="status">Memeriksa tautan pemulihan...</p>
  </main>

  <script>
    const SUPABASE_URL =
      "https://gdcpdjcmoliegaxidioo.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_0klYKdBWhyCnm7i0NPIwXg_XXKHIxoT;

    const SITE_URL =
      "https://comforting-meringue-2fd019.netlify.app";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    let recoveryReady = false;

    async function checkRecovery() {
      const { data, error } = await db.auth.getSession();

      if (error) {
        document.getElementById("status").textContent =
          "Gagal memeriksa tautan: " + error.message;
        return;
      }

      if (data.session) {
        recoveryReady = true;
        document.getElementById("status").textContent =
          "Tautan valid. Silakan buat password baru.";
      } else {
        document.getElementById("status").textContent =
          "Sesi pemulihan tidak ditemukan. Minta tautan reset password yang baru.";
      }
    }

    async function updatePassword() {
      const password =
        document.getElementById("newPassword").value;

      if (!recoveryReady) {
        document.getElementById("status").textContent =
          "Tautan pemulihan belum valid.";
        return;
      }

      if (password.length < 8) {
        document.getElementById("status").textContent =
          "Password minimal 8 karakter.";
        return;
      }

      document.getElementById("updateButton").disabled = true;
      document.getElementById("status").textContent =
        "Menyimpan password baru...";

      const { error } = await db.auth.updateUser({
        password: password
      });

      if (error) {
        document.getElementById("status").textContent =
          "Gagal: " + error.message;
        document.getElementById("updateButton").disabled = false;
        return;
      }

      document.getElementById("status").textContent =
        "Password berhasil diperbarui. Silakan kembali ke halaman login.";

      const link = document.createElement("a");
      link.href = SITE_URL;
      link.textContent = "Kembali ke NEXORA COMICS";
      link.style.color = "#b6aaff";
      link.style.display = "block";
      link.style.marginTop = "18px";
      document.querySelector(".panel").appendChild(link);
    }

    db.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" && session) {
        recoveryReady = true;
        document.getElementById("status").textContent =
          "Tautan valid. Silakan buat password baru.";
      }
    });

    checkRecovery();
  </script>
</body>
</html>
