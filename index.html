<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXORA COMICS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#0c1020;color:white;font-family:Arial,sans-serif}
header{padding:22px;background:#171d35;border-bottom:1px solid #303957}
h1{color:#a78bfa;margin:0}
main{max-width:500px;margin:35px auto;padding:20px}
.card{background:#171d35;padding:22px;border-radius:15px}
input{width:100%;padding:14px;margin:8px 0;background:#0c1020;border:1px solid #394362;border-radius:8px;color:white}
button{padding:13px;border:0;border-radius:8px;background:#8b5cf6;color:white;font-weight:bold;margin:6px 3px;cursor:pointer}
.secondary{background:#303957}
#message{margin-top:15px;line-height:1.5}
.hidden{display:none}
</style>
</head>

<body>
<header>
<h1>NEXORA COMICS</h1>
<p>Explore Your Manga Universe</p>
</header>

<main>
<section class="card" id="authBox">
<h2>Selamat Datang</h2>
<p>Masuk atau buat akun NEXORA COMICS.</p>

<input id="email" type="email" placeholder="Alamat email">
<input id="password" type="password" placeholder="Password">

<button onclick="register()">Daftar</button>
<button onclick="login()">Login</button>
<button onclick="forgotPassword()" class="secondary">Lupa Password?</button>

<div id="message"></div>
</section>

<section class="card hidden" id="userBox">
<h2>Berhasil Masuk!</h2>
<p id="userEmail"></p>
<p>Selamat datang di NEXORA COMICS.</p>
<button onclick="logout()">Logout</button>
</section>
</main>

<script>
const SUPABASE_URL =
"https://gdcpdjcmoliegaxidioo.supabase.co";

const SUPABASE_KEY =
"sb_publishable_0klYKdBWhyCnm7i0NPIwXg_XXKHIxoT";

const db = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const SITE_URL =
"https://comforting-meringue-2fd019.netlify.app";

function message(text){
document.getElementById("message").textContent=text;
}

async function register(){
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

if(!email || !password){
message("Isi email dan password terlebih dahulu.");
return;
}

if(password.length<8){
message("Password minimal 8 karakter.");
return;
}

message("Sedang membuat akun...");

const {data,error}=await db.auth.signUp({
email,
password,
options:{
emailRedirectTo:"https://comforting-meringue-2fd019.netlify.app/"

}
});

if(error){
message(error.message);
return;
}

if(data.session){
message("Akun berhasil dibuat dan kamu sudah masuk.");
}else{
message("Akun berhasil dibuat. Periksa email untuk verifikasi sebelum login.");
}
}

async function login(){
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

if(!email || !password){
message("Isi email dan password terlebih dahulu.");
return;
}

message("Sedang login...");

const {error}=await db.auth.signInWithPassword({
email,
password
});

if(error){
message(error.message);
}
}
async function forgotPassword(){
  const email=document.getElementById("email").value.trim();

  if(!email){
    message("Masukkan email terlebih dahulu.");
    return;
  }

  message("Mengirim tautan reset password...");

  const {error}=await db.auth.resetPasswordForEmail(email,{
    redirectTo:SITE_URL + "/reset-password.html"
  });

  if(error){
    message(error.message);
    return;
  }

  message("Tautan reset password sudah dikirim. Periksa email kamu.");
  }
async function logout(){
await db.auth.signOut();
}

function showUser(user){
document.getElementById("authBox").classList.add("hidden");
document.getElementById("userBox").classList.remove("hidden");
document.getElementById("userEmail").textContent=user.email;
}

function showAuth(){
document.getElementById("authBox").classList.remove("hidden");
document.getElementById("userBox").classList.add("hidden");
}

db.auth.onAuthStateChange((event,session)=>{
if(session){
showUser(session.user);
}else{
showAuth();
}
});

async function checkSession(){
const {data}=await db.auth.getSession();
if(data.session){
showUser(data.session.user);
}
}

checkSession();
</script>
</body>
  </html>
